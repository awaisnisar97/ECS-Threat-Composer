name: security scan to check if any secrets will be pushed 

on: 
  push: 
    branches: 
        - main

jobs: 
    security-scan: 
        runs-on: ubuntu-latest 
       
        steps: 
            - name: checkout repository 
              uses: actions/checkout@v7 
              with: 
                fetch-depth: 0
            - uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

           

