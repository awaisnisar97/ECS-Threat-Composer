name: Build and push docker image to ECR
on: 
    push:  
      branches:
        - main
    
    workflow_dispatch:

permissions: 
    id-token: write
    contents: read
jobs: 
    build-docker:
        runs-on: ubuntu-latest
        
        steps:
           - name: checkout code 
             uses: actions/checkout@v7 
           - name: set up Docker Buildx
             uses: docker/setup-buildx-action@v4
           - name: build docker image
             uses: docker/build-push-action@v7
             with:
                context: ./threat-app
                load: true 
                tags: threatmod:${{ github.sha }}
           
           - name: Run Trivy vulnerability scanner
             uses: aquasecurity/trivy-action@v0.36.0
             with:
                image-ref: 'threatmod:${{ github.sha }}'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

           - name: Debug OIDC claims
             uses: github/actions-oidc-debugger@main
           - name: configure AWS credentials 
             uses: aws-actions/configure-aws-credentials@v6.2.4
             with:
                role-to-assume: arn:aws:iam::594566440241:role/gh-actions-ecr
                aws-region: eu-west-2 
           
           - name: login to aws ecr 
             id: login-ecr
             uses: aws-actions/amazon-ecr-login@v2     

           - name: tag and push docker image to ecr
             env: 
                REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                REPOSITORY: threat-composer
                IMAGE_TAG: ${{ github.sha }}
             run: |
               docker tag threatmod:$IMAGE_TAG $REGISTRY/$REPOSITORY:$IMAGE_TAG
               docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

