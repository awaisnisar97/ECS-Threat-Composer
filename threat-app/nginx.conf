server {
    # Listen on the unprivileged Nginx port
    listen 8080;

    server_name _;

    # Location of the React production files
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint used by Docker, ECS and the ALB
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Serve existing files, otherwise send the request to React
    # This allows client-side routes such as /dashboard to work
    location / {
        try_files $uri $uri/ /index.html;
    }
}